#
# The only thing CI builds: the Windows installer.
#
# The installer is the Tauri shell plus the agent sidecar. It does NOT contain
# the browser core -- the core is a separate tarball the agent downloads after
# install, and a Chromium core cannot be built here anyway: a checkout is ~38 GB
# against a hosted runner's 14 GB of disk, and the first build is ~6 hours
# against the 6-hour job limit. So the core is not part of CI at all.
#
# The installer is not code-signed: there is no Windows certificate, so the
# built .exe raises SmartScreen on first run (More info -> Run anyway).

name: Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
        working-directory: desktop

      # `app:build` runs tauri build, whose beforeBuildCommand builds the agent
      # sidecar (scripts/sidecar.mjs) and the frontend, then produces the NSIS
      # installer under desktop/src-tauri/target/release/bundle/nsis/.
      - name: build the installer
        run: npm run app:build
        working-directory: desktop

      - name: locate the installer
        id: installer
        shell: bash
        run: |
          set -euo pipefail
          path=$(find desktop/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          if [ -z "$path" ]; then
            echo "!! no NSIS installer found under bundle/nsis" >&2
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "found: $path"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
